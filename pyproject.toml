[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhenxia"
version = "0.1.0"
description = "帧匣 — self-hosted video downloads and a SQLite media library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "yt-dlp[default]==2026.10.26",
  "douyin-downloader @ git+https://github.com/jiji262/douyin-downloader.git@1e08f03b8909b364fb6237d8f9f441e3fbf3d427",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "playwright>=1.40,<2",
  "aiohttp>=3.9,<4",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
zhenxia = "zhenxia.__main__:main"

[tool.setuptools.packages.find]
include = ["zhenxia*"]

[tool.setuptools.package-data]
zhenxia = ["static/*", "static/locales/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
